[project]
name = "fp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "safi-siddiqui-work", email = "safisiddiqui.work@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[all,standard]>=0.146.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
]

[project.scripts]
fp = "fp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"
